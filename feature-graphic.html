<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feature Graphic – The Club</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  .canvas {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #0a0e1a 0%, #111827 40%, #1a1040 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Subtle gradient orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.3;
  }
  .orb-1 {
    width: 400px; height: 400px;
    background: #35D0FF;
    top: -100px; left: -80px;
    opacity: 0.15;
  }
  .orb-2 {
    width: 350px; height: 350px;
    background: #C04BFF;
    bottom: -120px; right: -60px;
    opacity: 0.18;
  }
  .orb-3 {
    width: 250px; height: 250px;
    background: #5B6CFF;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.08;
  }

  /* Content layout */
  .content {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 48px;
    padding: 0 72px;
  }

  /* Logo */
  .logo-block {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .logo-icon {
    width: 110px;
    height: 110px;
    border-radius: 26px;
    background: linear-gradient(135deg, #35D0FF 0%, #5B6CFF 50%, #C04BFF 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(91, 108, 255, 0.3), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .logo-text {
    font-size: 36px;
    font-weight: 900;
    color: white;
    letter-spacing: -0.5px;
  }

  /* Text block */
  .text-block {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 560px;
  }

  .app-name {
    font-size: 42px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .app-name .highlight {
    background: linear-gradient(135deg, #35D0FF, #5B6CFF, #C04BFF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .description {
    font-size: 18px;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    line-height: 1.55;
    max-width: 480px;
  }

  /* Feature pills */
  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .pill {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    letter-spacing: 0.03em;
  }

  /* Thin border line at bottom */
  .bottom-accent {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #35D0FF, #5B6CFF, #C04BFF);
  }
</style>
</head>
<body>

<div class="canvas">
  <!-- Background orbs -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="content">
    <!-- Logo -->
    <div class="logo-block">
      <div class="logo-icon">
        <span class="logo-text">DLT</span>
      </div>
    </div>

    <!-- Text -->
    <div class="text-block">
      <div class="tagline">Real Life · Real Talk · Real Community</div>
      <div class="app-name">
        <span class="highlight">The Club</span> —<br>Doing Life Today
      </div>
      <div class="description">
        Track symptoms, connect with others, and manage life with Parkinson's — together.
      </div>
      <div class="pills">
        <span class="pill">Symptom Tracking</span>
        <span class="pill">AI Coach</span>
        <span class="pill">Community</span>
        <span class="pill">Care Partners</span>
        <span class="pill">Resources</span>
      </div>
    </div>
  </div>

  <div class="bottom-accent"></div>
</div>

</body>
</html>
